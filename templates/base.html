
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="sidebar">
    <h2>🎓 StudentHub</h2>

    <a href="/">Dashboard</a>
    <a href="/add">Add Student</a>
</div>

<div class="main">

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
